name: Sync main to rosmox-ai
on:
  push:
    branches: [main]
jobs:
  sync:
    if: github.repository == 'rosmox/riona'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to rosmox-ai/riona
        run: |
          git push --force https://x-access-token:${{ secrets.ROSMOX_AI_TOKEN }}@github.com/rosmox-ai/riona.git HEAD:refs/heads/main
